  <!-- spray mist from the nozzle -->
  <circle cx="63" cy="43" r="3.2" fill="#E3BE4A"/>
  <circle cx="70" cy="40.5" r="2.3" fill="#E3BE4A"/>
  <circle cx="75.5" cy="38.5" r="1.6" fill="#E3BE4A"/>
  <circle cx="66" cy="49" r="2" fill="#E3BE4A"/>
  <circle cx="72.5" cy="48" r="1.4" fill="#E3BE4A"/>
</svg>
